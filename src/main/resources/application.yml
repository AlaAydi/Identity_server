server:
  port: 8081

spring:
  application:
    name: identity-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_server}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.identityserver: DEBUG
    org.springframework.security: INFO
